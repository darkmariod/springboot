server {
    listen 80;
    server_name _;

    # Docker publica este nginx en 8080; sin esto las redirecciones
    # pierden el puerto y mandan a http://IP/app/ (puerto 80), que no existe.
    absolute_redirect off;

    # API → Laravel (PHP-FPM)
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        client_max_body_size 20M;
    }

    # Landing page → Laravel Blade (only the root)
    location = / {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ERP SPA at /app
    location /app {
        alias /usr/share/nginx/html/app;
        try_files $uri $uri/ /app/index.html;
    }

    # Static assets (JS, CSS, images) — serve from dist root for /app subfolder
    location ~* ^/app/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /usr/share/nginx/html$uri;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback — if someone hits an unknown path, try the SPA
    location / {
        return 404;
    }
}
